# LoopWise waste dataset configuration (broad material taxonomy, Option 1).
#
# Task type: image CLASSIFICATION (Ultralytics `yolo classify`).
# Layout expected under <dataset-root>/ :
#   train/<class_name>/*.jpg   val/<class_name>/*.jpg   test/<class_name>/*.jpg
#
# Canonical class order below is FIXED (index 0-7). It must match
# ml/classes.json and the generated CLASS_INDEX_MAP exactly. Do not reorder
# without re-exporting the mapping and bumping MODEL_VERSION.
#
# Names are in ALPHABETICAL order on purpose: Ultralytics derives class
# indices for folder-based classification datasets by sorting folder names,
# so this file, ml/classes.json, the train/val/test folders and the exported
# class-index map all agree by construction. ml/prepare_dataset.py generates
# the per-dataset copy; ml/export_onnx.py verifies the checkpoint's own
# `names` against this file before writing CLASS_INDEX_MAP.

path: ./data/waste-classify   # dataset root (train.py overrides with an absolute path)
train: train
val: val
test: test

names:
  0: battery_hazardous
  1: glass
  2: metal
  3: organic
  4: other_residue
  5: paper_cardboard
  6: plastic
  7: textile
